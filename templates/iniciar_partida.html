<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='iniciar_partida.css') }}">

    <title>Iniciar Partida</title>

</head>

<body>

    <div class="container">

        <h1> TT Performance</h1>

        <h2>🏓 Partida em Andamento</h2>

        <div class="placar">

            <div class="jogador">

                <h3>{{partida.nome}}</h3>

                <div class="pontos" id="pontosJogador">
                    0
                </div>

            </div>


            <div class="versus">

                <span>VS</span>

            </div>


            <div class="jogador">

                <h3>{{partida.adversario}}</h3>

                <div class="pontos" id="pontosAdversario">
                    0
                </div>

            </div>

        </div>


        <div class="sets">

            <h2>Sets</h2>

            <div class="placar-set">

                <div>

                    <h3>{{partida.nome}}</h3>

                    <strong>0</strong>

                </div>


                <div class="versus">

                    ×

                </div>


                <div>

                    <h3>{{partida.adversario}}</h3>

                    <strong>0</strong>

                </div>

            </div>

        </div>


       
         <!-- REGISTRO DO PONTO -->
        <div class="marcacao-pontos">

        <h2>Marcar ponto</h2>

        <div class="tabela-marcacao">

            <!-- ERICK -->
            <div class="coluna-jogador">

                <h3>{{ partida.nome }}</h3>

                <button onclick="marcarErro('jogador', 'F')">
                    Forhand
                </button>

                <button onclick="marcarErro('jogador', 'B')">
                    BackHand
                </button>

                <button onclick="marcarErro('jogador', 'S')">
                    Saque
                </button>

            </div>


            <!-- PONTOS -->
            <div class="coluna-pontos">

            </div>


            <!-- JOÃO -->
            <div class="coluna-jogador">

                <h3>{{ partida.adversario }}</h3>

                <button onclick="marcarErro('adversario', 'F')">
                    Forhand
                </button>

                <button onclick="marcarErro('adversario', 'B')">
                    BackHand
                </button>

                <button onclick="marcarErro('adversario', 'S')">
                    Saque
                </button>

            </div>

        </div>

</div>
        

        <!-- HISTÓRICO -->

        <div class="historico">

            <h2>Histórico da partida</h2>

            <div id="listaJogadas"></div>

        </div>


        <a href="/partida" class="btn-voltar">

            ← Voltar para Partidas

        </a>

        <!-- MENSAGEM DA VITÓRIA -->
        <div id="popupVitoria" class="popup-overlay">
    
        <div class="popup">
    
            <div class="trofeu">
                🏆
            </div>
    
            <h2>Partida Encerrada!</h2>
    
            <p id="mensagemVitoria"></p>
    
            <button
                onclick="fecharPopup()"
                class="btn-fechar"
            >
                Fechar
            </button>
    
        </div>
    </div>
    <script>

    const nomeJogador = "{{ partida.nome }}";

    const nomeAdversario = "{{ partida.adversario }}";

</script>
    <script src="{{ url_for('static', filename='iniciar_partida.js') }}"></script>
</body>

</html>
